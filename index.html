["التفكير الحاسوبي وحل المشكلات",`<h4>ما هو التفكير الحاسوبي؟</h4>
<p>التفكير الحاسوبي (Computational Thinking) أسلوب تفكير منظم نحل به المشكلات بطريقة تشبه طريقة عمل الحاسوب. ويمكن تطبيقه في الحياة اليومية، وليس في البرمجة فقط.</p>
<div class="note"><b>معلومة مهمة:</b> التفكير الحاسوبي لا يعني أن تفكر مثل الحاسوب، بل أن تفكر بطريقة منظمة ومنطقية لحل المشكلات.</div>
<h4>الخطوات الأربع</h4>
<table><tr><th>الخطوة</th><th>الاسم بالإنجليزية</th><th>الشرح</th></tr>
<tr><td>1. التحليل</td><td>Decomposition</td><td>تقسيم المشكلة الكبيرة إلى مشكلات صغيرة</td></tr>
<tr><td>2. التعرف على الأنماط</td><td>Pattern Recognition</td><td>البحث عن التشابهات والأنماط المتكررة</td></tr>
<tr><td>3. التجريد</td><td>Abstraction</td><td>تجاهل التفاصيل غير المهمة</td></tr>
<tr><td>4. تصميم الخوارزمية</td><td>Algorithm</td><td>وضع خطوات مرتبة لحل المشكلة</td></tr></table>
<h4>مثال: تنظيم حفل المدرسة</h4>
<ol><li><b>التحليل:</b> نقسم الحفل إلى الدعوات، والمكان، والضيافة، والبرنامج.</li>
<li><b>التعرف على الأنماط:</b> في كل عام تتكرر نفس الخطوات تقريباً.</li>
<li><b>التجريد:</b> نتجاهل التفاصيل الصغيرة ونركز على الميزانية.</li>
<li><b>الخوارزمية:</b> تحديد الميزانية، ثم حجز القاعة، ثم إرسال الدعوات، ثم التنفيذ.</li></ol>
<div class="note"><b>تذكّر:</b> التحليل ثم الأنماط ثم التجريد ثم الخوارزمية. ويمكن تطبيقها على أي مشكلة، مثل تنظيم رحلة أو ترتيب المذاكرة.</div>`],

<h4>أنواع خوارزميات الذكاء الاصطناعي</h4>

["الدوال ذات المعاملات في Python",`<h4>ما هي الدالة؟</h4>
<p>الدالة (Function) مجموعة من الأوامر البرمجية تُجمع تحت اسم واحد، ويمكن استدعاؤها عند الحاجة. فائدتها: تنظيم الكود، وتقليل التكرار، وسهولة الصيانة.</p>
<h4>تعريف دالة بسيطة</h4>
<pre>def greet():

greet()   # Hello, World!</pre>
<div class="note">تعريف الدالة بـ def لا ينفذها. لن تعمل إلا عند استدعائها باسمها.</div>

<pre>def greet(name):

greet("Ahmed")   # Hello, Ahmed

<pre>def add(x, y):

<h4>دالة تُرجع قيمة</h4>

<h4>الفرق بين print و return</h4>
<table><tr><th>print</th><th>return</th></tr>

<tr><td>الدالة لا تُرجع شيئاً</td><td>الدالة تُرجع القيمة وتنتهي</td></tr></table>`],
["معالجة أخطاء مدخلات المستخدم",`<h4>لماذا نعالج الأخطاء؟</h4>
<p>لأن المستخدم قد يدخل قيمة غير متوقعة، مثل: حروف بدل أرقام، أو القسمة على صفر، أو قيمة خارج النطاق. وبدون معالجة ينهار البرنامج.</p>
<h4>استخدام try / except</h4>
<pre>try:

<h4>مثال 1: القسمة على صفر</h4>
<pre>try:

<h4>مثال 2: else و finally</h4>

["التنبؤ باستخدام نموذج الذكاء الاصطناعي",`<h4>ما هو التنبؤ؟</h4>
<p>التنبؤ (Prediction) هو توقع نتيجة جديدة بناءً على أنماط تعلمها النموذج من بيانات سابقة.</p>
<h4>الفرق بين البرمجة التقليدية ونموذج الذكاء الاصطناعي</h4>
<table><tr><th>المعيار</th><th>البرمجة التقليدية</th><th>نموذج الذكاء الاصطناعي</th></tr>
<tr><td>المدخل</td><td>بيانات + قواعد</td><td>بيانات + نتائج</td></tr>
<tr><td>العملية</td><td>تنفيذ القواعد</td><td>تعلّم العلاقة</td></tr>
<tr><td>الناتج</td><td>نفس النتيجة دائماً</td><td>توقع مرن</td></tr></table>
<h4>النموذج الخطي (Linear Model)</h4>
<pre>y = w × x + b</pre>
<table><tr><th>الرمز</th><th>المعنى</th></tr>
<tr><td>x</td><td>المدخلات (Input)</td></tr>
<tr><td>w</td><td>الوزن (Weight): قوة التأثير</td></tr>
<tr><td>b</td><td>الانحياز (Bias): قيمة ثابتة</td></tr>
<tr><td>y</td><td>الناتج المتوقع (Output)</td></tr></table>
<h4>مثال: التنبؤ بدرجة الطالب</h4>
<p>كل ساعة دراسة تعطي 5 درجات، والبداية 10 درجات، فتكون المعادلة <code>y = 5x + 10</code>.</p>
<table><tr><th>ساعات الدراسة (x)</th><th>الدرجة المتوقعة (y)</th></tr>
<tr><td>0</td><td>10</td></tr><tr><td>2</td><td>20</td></tr><tr><td>5</td><td>35</td></tr><tr><td>10</td><td>60</td></tr></table>
<div class="note"><b>ملاحظة:</b> النموذج يتعلم قيمتي w و b من البيانات، وليس من قواعد ثابتة.</div>
<h4>خطوات بناء نموذج ذكاء اصطناعي بسيط</h4>
<ol><li>جمع البيانات (ساعات الدراسة + الدرجات الفعلية).</li><li>تدريب النموذج (تعلّم w و b).</li><li>اختبار النموذج على بيانات جديدة.</li><li>التنبؤ بدرجات طلاب جدد.</li></ol>`],
["الذكاء الاصطناعي وحقوق الملكية الفكرية",`<h4>ما هي الملكية الفكرية؟</h4>

["الوعي السيبراني والألعاب الإلكترونية الخطرة",`<h4>ما هو الوعي السيبراني؟</h4>
<p>معرفة المخاطر الإلكترونية وكيفية الحماية منها.</p>
<h4>أنواع المخاطر السيبرانية</h4>
<table><tr><th>النوع</th><th>الوصف</th></tr>
<tr><td>التصيد الاحتيالي</td><td>رسائل مزيفة لسرقة البيانات</td></tr>
<tr><td>البرمجيات الخبيثة</td><td>فيروسات وبرامج ضارة</td></tr>
<tr><td>الاختراق</td><td>الوصول غير المصرح به للحسابات</td></tr>

const $=s=>document.querySelector(s);

function nav(cur){

function quiz(qs,el,key){
  let h='';
  qs.forEach((x,i)=>{
    h+=`<div class=q id="${key}q${i}"><p><b>${i+1}.</b> ${x.q}</p>`;
    if(x.t=='m')x.o.forEach((o,j)=>h+=`<label><input type=radio name="${key}${i}" value=${j}> <span dir=auto>${o}</span></label>`);
    else if(x.t=='t')h+=`<label><input type=radio name="${key}${i}" value=1> صح</label><label><input type=radio name="${key}${i}" value=0> خطأ</label>`;
    else h+=`<input type=text class=ans dir=auto autocomplete=off aria-label="الإجابة">`;
    h+='<div class=fb></div></div>';
  });
  h+='<button class=btn>صحّح الإجابات</button><div class=score role=status></div>';
  el.innerHTML=h;
  el.querySelector('.btn').onclick=()=>{
    let s=0;
    qs.forEach((x,i)=>{
      const b=el.querySelector('[id="'+key+'q'+i+'"]');let ok=false,show;
      if(x.t=='f'){ok=x.a.split('|').some(a=>nz(a)===nz(b.querySelector('input').value));show=x.a.split('|')[0]}
      else{const c=b.querySelector('input:checked');
        if(x.t=='m'){ok=!!c&&+c.value===x.a;show=x.o[x.a]}else{ok=!!c&&(c.value=='1')===x.a;show=x.a?'صح':'خطأ'}}
      if(ok)s++;
      b.className='q '+(ok?'ok':'no');
      b.querySelector('.fb').textContent=ok?'إجابة صحيحة':'الإجابة الصحيحة: '+show;
    });
    const p=Math.round(s/qs.length*100);
    el.querySelector('.score').textContent=`الدرجة: ${s} من ${qs.length} (${p}%) — ${p>=85?'ممتاز':p>=65?'جيد':'راجع الدرس وحاول مرة أخرى'}`;
    save(key,s);nav(key);
  };
}

}
