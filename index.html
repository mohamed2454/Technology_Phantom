].forEach(r=>Q.push({l:r[0],t:'f',q:r[1],a:r[2]}));

const $=s=>document.querySelector(s);
const nz=s=>String(s).trim().toLowerCase().replace(/[()\s"'،,]/g,'').replace(/[أإآ]/g,'ا').replace(/ة/g,'ه').replace(/ى/g,'ي');
const best=()=>{try{return JSON.parse(localStorage.getItem('ict3')||'{}')}catch(e){return{}}};
const save=(k,v)=>{try{const b=best();if(!(k in b)||v>b[k]){b[k]=v;localStorage.setItem('ict3',JSON.stringify(b))}}catch(e){}};
const cnt=k=>Q.filter(x=>x.l===k).length;

function nav(cur){
  const b=best();let h='<button data-k="home"'+(cur=='home'?' class=on':'')+'>الصفحة الرئيسية</button>';
  U.forEach((u,i)=>{h+=`<h3>${u.t}</h3>`;u.L.forEach((l,j)=>{const k=i+'_'+j;h+=`<button data-k="${k}"${cur==k?' class=on':''}><span>${l[0]}</span><small>${k in b?b[k]+'/':''}${cnt(k)}</small></button>`})});
  h+=`<h3>اختبار</h3><button data-k="exam"${cur=='exam'?' class=on':''}><span>الامتحان الشامل</span><small>${'exam' in b?b.exam+'/':''}${Q.length}</small></button>`;
  $('#nav').innerHTML=h;
  $('#nav').querySelectorAll('button').forEach(x=>x.onclick=()=>{location.hash=x.dataset.k});
}
function quiz(qs,el,key){
  let h='';
  qs.forEach((x,i)=>{
    h+=`<div class=q id="${key}q${i}"><p><b>${i+1}.</b> ${x.q}</p>`;
    if(x.t=='m')x.o.forEach((o,j)=>h+=`<label><input type=radio name="${key}${i}" value=${j}> <span dir=auto>${o}</span></label>`);
    else if(x.t=='t')h+=`<label><input type=radio name="${key}${i}" value=1> صح</label><label><input type=radio name="${key}${i}" value=0> خطأ</label>`;
    else h+=`<input type=text class=ans dir=auto autocomplete=off aria-label="الإجابة">`;
    h+='<div class=fb></div></div>';
  });
  h+='<button class=btn>صحّح الإجابات</button><div class=score role=status></div>';
  el.innerHTML=h;
  el.querySelector('.btn').onclick=()=>{
    let s=0;
    qs.forEach((x,i)=>{
      const b=el.querySelector('#'+key+'q'+i);let ok=false,show;
      if(x.t=='f'){ok=x.a.split('|').some(a=>nz(a)===nz(b.querySelector('input').value));show=x.a.split('|')[0]}
      else{const c=b.querySelector('input:checked');
        if(x.t=='m'){ok=!!c&&+c.value===x.a;show=x.o[x.a]}else{ok=!!c&&(c.value=='1')===x.a;show=x.a?'صح':'خطأ'}}
      if(ok)s++;
      b.className='q '+(ok?'ok':'no');
      b.querySelector('.fb').textContent=ok?'إجابة صحيحة':'الإجابة الصحيحة: '+show;
    });
    const p=Math.round(s/qs.length*100);
    el.querySelector('.score').textContent=`الدرجة: ${s} من ${qs.length} (${p}%) — ${p>=85?'ممتاز':p>=65?'جيد':'راجع الدرس وحاول مرة أخرى'}`;
    save(key,s);nav(key);
  };
}
function show(){
  const k=location.hash.slice(1)||'home',m=$('#main');
  if(k=='home'){
    m.innerHTML=`<h2>مرحباً بك</h2><p>اختر درساً من القائمة لتقرأ الشرح، ثم أجب عن أسئلته واحصل على درجتك فوراً. يوجد ${Q.length} سؤالاً موزعة على ${U.reduce((a,u)=>a+u.L.length,0)} دروس في وحدتين، وأعلى درجة تحصل عليها في كل درس تُحفظ على جهازك.</p><p>ثم جرّب <b>الامتحان الشامل</b> لتختبر نفسك في المنهج كله.</p>`;
  }else if(k=='exam'){
    m.innerHTML=`<h2>الامتحان الشامل</h2><p>${Q.length} سؤالاً من الوحدتين: اختيار من متعدد، وصح أم خطأ، وأكمل. لكل سؤال درجة واحدة.</p><div id=qz></div>`;
    quiz(Q,$('#qz'),'exam');
  }else{
    const [i,j]=k.split('_').map(Number);const l=U[i]&&U[i].L[j];
    if(!l){location.hash='home';return}
    const qs=Q.filter(x=>x.l===k);
    m.innerHTML=`<h2>${l[0]}</h2><div>${l[1]}</div><div class=sep><h2>اختبر نفسك (${qs.length} أسئلة)</h2></div><div id=qz></div>`;
    quiz(qs,$('#qz'),k);
  }
  nav(k);scrollTo(0,0);
}
addEventListener('hashchange',show);show();
</script>
</body>
</html>
